steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/tracking-api'
      - '.'

  # 2. Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/tracking-api'

  # 3. Deploy no Cloud Run (com Secret Manager)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tracking-api
      - --image
      - gcr.io/$PROJECT_ID/tracking-api
      - --region
      - southamerica-east1
      - --platform
      - managed
      - --allow-unauthenticated
      - --update-secrets
      - SECRET_KEY=tracking-api-secret-key:latest

images:
  - gcr.io/$PROJECT_ID/tracking-api